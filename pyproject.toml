[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sume"
version = "0.2.0"
description = "Images and video from the Sume Open API: one call to run any open.sume.com model and save the file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sume Labs", email = "dev@sume.com" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.25,<1", "typing-extensions>=4.7"]
keywords = ["sume", "open.sume.com", "image-generation", "video-generation", "lipsync", "generative-media", "ai", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://open.sume.com"
Documentation = "https://github.com/sumelabs/sume-python#readme"
Repository = "https://github.com/sumelabs/sume-python"
Issues = "https://github.com/sumelabs/sume-python/issues"
Changelog = "https://github.com/sumelabs/sume-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sume"]

[tool.hatch.build.targets.sdist]
include = ["src/sume", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]
# Written by scripts/generate.py; `python scripts/generate.py --check` guards it instead.
extend-exclude = ["src/sume/_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP045", "RUF001", "RUF002", "RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/sume"]
