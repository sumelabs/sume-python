name: Types match the API

# The model ids and request fields in src/sume/_generated.py come from the live
# API. This checks weekly that they still match; when it fails, run
# `python scripts/generate.py`, review the diff, and release.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/generate.py --check
